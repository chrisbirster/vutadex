name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test:
    name: Node 26 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node index.ts help
