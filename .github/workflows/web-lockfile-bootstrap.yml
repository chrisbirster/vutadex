# One-time branch-scoped bootstrap. Remove after the lockfile is committed.
name: Bootstrap workspace lockfile
on:
  push:
    branches: [feat/web-app-foundation-20261030]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: lock npm workspaces for web and terminal'
            git push origin HEAD:feat/web-app-foundation-20261030
          fi
