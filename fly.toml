# PROPOSED staging-first deployment; owner approval required before use.
# This is a NEW app and does not replace the legacy vutadex-app.
app = "vutadex-web"
primary_region = "iad"

[deploy]
  strategy = "rolling"

[build]
  dockerfile = "apps/web/Dockerfile"

# Exactly one small machine. fly deploy creates TWO machines by default for an
# app with an http service (docs.fly.io/apps/app-availability), so deploy with:
#   fly deploy --ha=false
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/v1/health"

# Staging uses Turso exclusively (owner decision 2026-11-01): no persistent
# volume and no local-SQLite fallback in the deployed app. The server fails
# closed at boot when NODE_ENV=production and TURSO_DATABASE_URL is unset, so a
# misconfigured deploy stops instead of running on ephemeral storage. Local
# SQLite remains for tests and the CLI app, unchanged.
#
# Set TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, APP_ORIGIN, AWS_REGION,
# SES_FROM_EMAIL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and optionally
# AWS_SESSION_TOKEN as Fly secrets. Never commit credentials or real
# APP_ORIGIN values here.
