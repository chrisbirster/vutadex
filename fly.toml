app = "vutadex"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  VUTADEX_ENV = "production"
  VUTADEX_MARKETING_ORIGIN = "https://vutadex.com"
  VUTADEX_GAME_ORIGIN = "https://game.vutadex.com"
  VUTADEX_COOKIE_SECURE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/api/v1/healthz"
